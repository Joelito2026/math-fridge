services:
  db:
    image: postgres:15-alpine
    container_name: math_fridge_db
    restart: always
    environment:
      POSTGRES_USER: math_admin
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: math_fridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: